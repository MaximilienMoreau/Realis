spring:
  application:
    name: realis-backend

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false   # Instant → ISO-8601 string ("2024-01-15T10:30:00Z")

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gère les migrations, Hibernate ne touche pas au schéma
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 501MB

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

realis:
  app:
    frontend-url: ${FRONTEND_URL:https://realis.app}

  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000       # 24h

  storage:
    path: ${STORAGE_PATH}
    encryption-key: ${ENCRYPTION_KEY}
    quota-bytes: ${STORAGE_QUOTA_BYTES:5368709120}

  network:
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}

  tsa:
    provider: ${TSA_PROVIDER:freetsa}
    url: ${TSA_URL:https://freetsa.org/tsr}
    cert-path: ${TSA_CERT_PATH:/app/tsa-certs/freetsa-ca.crt}
    timeout-ms: 10000
