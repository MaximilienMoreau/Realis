spring:
  application:
    name: realis-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jackson:
    serialization:
      write-dates-as-timestamps: false   # Instant → ISO-8601 string ("2024-01-15T10:30:00Z")

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway gère les migrations, Hibernate ne touche pas au schéma
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: 8080
  servlet:
    context-path: /

# En-têtes de sécurité HTTP
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

realis:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000       # 24h

  storage:
    path: ${STORAGE_PATH}
    encryption-key: ${ENCRYPTION_KEY}

  tsa:
    provider: ${TSA_PROVIDER:freetsa}
    url: ${TSA_URL:https://freetsa.org/tsr}
    cert-path: ${TSA_CERT_PATH:/app/tsa-certs/freetsa-ca.crt}
    timeout-ms: 10000
