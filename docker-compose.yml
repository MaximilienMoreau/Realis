services:

  # ── Base de données ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   # Exposé pour le développement local (mvn spring-boot:run)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - realis_net

  # ── Backend Spring Boot ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_PATH: ${STORAGE_PATH}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TSA_PROVIDER: ${TSA_PROVIDER}
      TSA_URL: ${TSA_URL}
      TSA_CERT_PATH: ${TSA_CERT_PATH}
      # Défaut explicite : sans lui, une variable absente de .env est passée comme
      # chaîne vide (pas absente) au conteneur, et le défaut Spring de application.yml
      # (${FRONTEND_URL:https://realis.app}) ne s'applique alors pas : les liens dans
      # les certificats PDF seraient générés avec une URL vide.
      FRONTEND_URL: ${FRONTEND_URL:-https://realis.app}
      TRUST_FORWARDED_FOR: ${TRUST_FORWARDED_FOR:-false}
    volumes:
      - captures_data:/data/captures
    ports:
      - "8080:8080"
    healthcheck:
      # /actuator/health (pas /api/health, qui répond "UP" sans jamais toucher la base) :
      # inclut par défaut la vérification de connexion PostgreSQL via DataSourceHealthIndicator,
      # donc détecte une base devenue inaccessible après le démarrage du conteneur.
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - realis_net

  # ── Frontend Next.js ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    networks:
      - realis_net

volumes:
  postgres_data:
  captures_data:

networks:
  realis_net:
    driver: bridge
