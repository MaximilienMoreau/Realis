services:
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks: [realis_net]
  backend:
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_AUTH: 'false'
      SMTP_STARTTLS: 'false'
      REALIS_MAIL_FROM: realis@localhost
